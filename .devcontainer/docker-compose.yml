# Devcontainer services: the app container plus a Postgres on the same
# compose network, reachable at host "postgres" (no host port needed;
# pgx doesn't support SCRAM so trust auth is used for dev).
services:
  app:
    image: ocaml/opam:debian-12-ocaml-5.3
    user: opam
    command: sleep infinity
    volumes:
      - ..:/workspaces/stratum:cached
    depends_on:
      - postgres
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: stratum
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
